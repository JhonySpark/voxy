schema: spec-driven

# Contexto do Projeto Voxy Frontend
context: |
  O Voxy é uma plataforma de comunicação em tempo real moderna (voz, áudio, vídeo, compartilhamento de tela em 60fps/4k, chat em tempo real, servidores, canais e amigos), construída com React 19, TypeScript, Vite e Electron (Desktop).
  A aplicação utiliza LiveKit WebRTC para transporte de mídia de ultra baixa latência e integra-se profundamente ao Windows via Electron IPC e binários nativos C++ para captura de áudio e streaming de jogos em tempo real.
  O app é distribuído tanto via instalador executável tradicional (NSIS) quanto via Microsoft Store (pacote MSIX).
  O projeto possui forte foco em alto desempenho, design refinado no conceito "Obsidian Mint" (Dark Glassmorphism, Neon Bloom, microanimações) e suporte nativo a múltiplos idiomas (Português, Inglês e Espanhol).

# Regras Globais de Desenvolvimento, Estilização, Tradução e Arquitetura
rules:
  # Regras fundamentais aplicáveis a todo o código do frontend
  code_standards:
    # =========================================================================
    # 1. PADRÕES DE ESTILO, TEMA E DESIGN SYSTEM (Obsidian Mint)
    # =========================================================================
    - "Zero Inline Styles: Nunca use estilos inline (style={{ ... }}) no código JSX/TSX. Todo estilo visual deve residir em arquivos de estilo dedicados."
    - "CSS Modules Obrigatório: O padrão primário de estilização para novos componentes e refatorações é CSS Modules (<ComponentName>.module.css), localizado no mesmo diretório do componente."
    - "Classes Legadas: Para componentes que ainda utilizam CSS regular (<ComponentName>.css), respeite as classes existentes e refatore gradualmente para CSS Modules, sem jamais injetar regras CSS inline arbitrárias."
    - "Exceção Única para style={{}}: Permitido exclusivamente para valores numéricos contínuos calculados estritamente em runtime (ex: coordenadas dinâmicas de drag-and-drop a 60fps ou largura percentual de VU meter de áudio em tempo real), preferindo sempre a passagem de CSS variables (--valor) via style inline."
    - "Uso Obrigatório de Tokens do Tema: É estritamente obrigatório seguir a paleta oficial e o design system definido no :root de src/index.css e src/styles/tokens/. Proibido utilizar cores hexadecimais ou RGB arbitrárias (como #fff, #000, #34d399 soltos) diretamente no CSS ou TSX."
    - |
      Tokens de Fundo (Canvas & Superfícies):
        • --bg-primary (#0b0f17): Fundo principal do aplicativo (Obsidian Base Canvas profundo).
        • --bg-secondary (rgba(15, 23, 42, 0.65)): Superfícies translúcidas e cards secundários (Surface Glass).
        • --bg-tertiary (rgba(30, 41, 59, 0.45)): Elevação de painéis, listas e agrupamentos.
        • --bg-accent (#1e293b): Fundo de elementos interativos, cartões internos e badges.
        • --glass-bg (rgba(17, 24, 39, 0.75)): Modais e popovers com backdrop blur.
    - |
      Tokens de Tipografia e Contraste:
        • --text-primary (#f8fafc): Texto principal, títulos e elementos de alta ênfase.
        • --text-secondary (#94a3b8): Rótulos de campos, subtítulos e descrições secundárias.
        • --text-muted (#475569): Placeholders, timestamps e estados desabilitados.
    - |
      Tokens de Marca, Ação e Feedback:
        • --brand-primary (#34d399): Cor principal da marca Voxy (verde esmeralda luminoso) para botões de ação (CTA), estados ativos, switches e badges.
        • --brand-hover (#059669): Estado hover e foco de elementos de marca.
        • --danger (#ffb4ab): Alertas de erro, ações destrutivas e desconexão.
        • --success (#34d399): Conexões ativas, confirmações e status online.
    - |
      Tokens de Bordas, Sombras e Glassmorphism:
        • --border-subtle (rgba(255, 255, 255, 0.08)): Bordas e divisores suaves em toda a UI.
        • --shadow-sm (inset 0 1px 0 rgba(255, 255, 255, 0.08)): Realce sutil em botões e inputs.
        • --shadow-md (0 0 12px rgba(52, 211, 153, 0.3)): Brilho de neon bloom para ações em destaque.
        • --shadow-lg (0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 1px 1px rgba(255, 255, 255, 0.12)): Elevação de modais e menus suspensos.
        • Glassmorphism: Aplicar backdrop-filter: blur(20px a 28px) ou a classe utilitária .glass-panel para criar profundidade.
    - |
      Tipografia Oficial:
        • Títulos e cabeçalhos (h1-h6, títulos de modais, cabeçalhos de seção): usar 'Space Grotesk', sans-serif com letter-spacing: -0.01em.
        • Corpo de texto, formulários, chat, tooltips e botões: usar 'Inter', sans-serif.

    # =========================================================================
    # 2. PADRÕES DE TRADUÇÃO E INTERNACIONALIZAÇÃO (i18n)
    # =========================================================================
    - "Proibição de Texto Fixo (Hardcoded): Toda e qualquer string de texto visível ao usuário deve ser obrigatoriamente internacionalizada via t('chave') (react-i18next)."
    - "Abrangência Completa de i18n: Títulos, subtítulos, rótulos (labels), placeholders, botões, tooltips (title=\"...\"), aria-labels, mensagens de erro, alertas de validação, toasts e modais devem usar chaves de tradução."
    - "Paridade Estrita entre Idiomas: Toda chave nova adicionada deve obrigatoriamente existir com tradução precisa em todos os três arquivos de locale: src/locales/pt.json, src/locales/en.json e src/locales/es.json."
    - "Validação de Paridade Obrigatória: Antes de concluir qualquer tarefa ou PR, é obrigatório executar npm run validate:i18n e garantir 0 erros de paridade."
    - "Nomenclatura Semântica de Chaves: Seguir a convenção hierárquica por domínio: common.*, auth.*, chat.*, server.*, channel.*, voice.*, user.*, settings.*, errors.*."
    - "Tradução de Erros de Backend: Erros de API devem ser tratados por getApiErrorMessage() ou mapeados por código de erro para evitar que strings brutas do backend vazem para a interface."

    # =========================================================================
    # 3. ARQUITETURA, ORGANIZAÇÃO E BOAS PRÁTICAS DE DESENVOLVIMENTO
    # =========================================================================
    - "Organização por Features: O código com escopo de domínio específico reside estritamente em src/features/<feature_name>/ (contendo components/, hooks/, etc.)."
    - "Camadas Globais Compartilhadas:
        • src/core/: Tipos, contratos, enums e utilitários globais agnósticos de framework (Clean Architecture / Hexagonal).
        • src/components/common/: Componentes reutilizáveis de UI sem regra de negócio específica.
        • src/infrastructure/: Adaptadores de rede, HTTP client, WebSockets, LiveKit e integrações com o sistema operacional."
    - "Single Responsibility Principle (SRP): Cada componente deve ter uma única responsabilidade clara. Componentes com mais de 250 linhas devem ser obrigatoriamente decompostos em subcomponentes menores e hooks dedicados."
    - "Separação entre Apresentação e Regra de Negócio: Efeitos colaterais, chamadas de API, listeners de eventos e chamadas IPC do Electron devem ser extraídos para Custom Hooks (use<FeatureName>), mantendo o JSX focado apenas na renderização declarativa."
    - "Tipagem TypeScript Estrita: Todas as props de componentes devem ter sua própria interface ou type explicitamente declarado (ex: interface ComponentNameProps). Proibido o uso de 'any' indiscriminado."
    - "Gerenciamento de Ciclo de Vida e Cleanup: Todo useEffect que registra listeners (IPC, window events, websockets, streams de mídia, timers) DEVE retornar sua respectiva função de limpeza para evitar memory leaks."
    - "Compatibilidade Desktop/Store: Tratar com segurança a presença ou ausência de APIs do Electron (ipcRenderer) e respeitar o ambiente da Microsoft Store (process.windowsStore), evitando abrir fluxos incompatíveis com sandbox."
    - "Aderência aos Padrões do Projeto: Manter estritamente os padrões estabelecidos de nomenclatura, arquitetura e desenvolvimento (Clean Code, SOLID, KISS, YAGNI, DRY). Nunca criar padrões paralelos sem alinhamento prévio."

    # =========================================================================
    # 4. BANCO DE DADOS, PRISMA E MIGRAÇÕES
    # =========================================================================
    - "Migrações Estritas Obrigatórias: Toda e qualquer alteração no esquema do banco de dados deve ser executada ESTRITAMENTE via migrações do Prisma (npx prisma migrate dev / deploy)."
    - "Proibição Absoluta de db push: É terminantemente proibido utilizar prisma db push em qualquer ambiente que possua tabela de controle _prisma_migrations."
    - "Validação de Status Pós-Migração: Toda tarefa de backend que envolva banco de dados obrigatoriamente deve executar npx prisma migrate status e atestar 0 migrações com falha antes da conclusão."

  # Regras para artefatos do OpenSpec
  proposal:
    - Sempre descrever o impacto na arquitetura de features (src/features/) e em arquivos de estilo (.module.css).
    - Deixar explícito que não haverá estilos inline e como os componentes serão divididos.
    - Confirmar aderência ao tema Obsidian Mint e aos tokens CSS do index.css.
    - Especificar as chaves de internacionalização (i18n) necessárias em PT, EN e ES, garantindo conformidade.
    - Manter propostas claras, objetivas e focadas na solução arquitetural.

  specs:
    - Detalhar contratos de dados, interfaces TypeScript e assinaturas de Custom Hooks.
    - Especificar a estrutura de diretórios e arquivos de componentes e estilos correspondentes (.module.css).
    - Declarar os tokens CSS do tema (--bg-*, --text-*, --brand-*, etc.) que serão consumidos pelo componente.
    - Declarar o comportamento responsivo e as classes de glassmorphism aplicadas.
    - Mapear requisitos de internacionalização e todas as chaves de tradução envolvidas.

  tasks:
    - "Dividir tarefas priorizando: 1) Criação de contratos/tipos, 2) Custom Hooks e lógica, 3) Componentes e CSS Modules, 4) Integração e i18n, 5) Validação e build."
    - Incluir tarefas explícitas de verificação de build (npm run build) e integridade visual sem estilos inline e com tokens de tema.
    - Incluir tarefa explícita de validação de paridade de traduções (npm run validate:i18n).

# Orientações operacionais
operations:
  apply:
    guidance:
      - Nunca insira blocos style={{}} temporários para depois ajustar; aplique diretamente em classes do CSS Module.
      - Ao criar novos componentes, crie a pasta correspondente contendo Componente.tsx e Componente.module.css.
      - Utilize exclusivamente variáveis var(--token) para cores de fundo, bordas, textos e efeitos luminosos.
      - Nunca use texto hardcoded; todas as strings, tooltips e placeholders devem usar t().
      - Execute npm run validate:i18n e npm run build ao finalizar alterações para garantir conformidade de tipos e traduções.
  archive:
    guidance:
      - Registre brevemente os componentes criados ou refatorados e confirme a conformidade com as regras de CSS, tokens de tema, i18n e tipagem.
