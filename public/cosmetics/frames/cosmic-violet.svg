<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="cosmicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="violetGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes cosmicTwinkle {
      0%, 100% { opacity: 0.75; transform: scale(1); filter: drop-shadow(0 0 5px #a855f7); }
      50% { opacity: 1; transform: scale(1.02); filter: drop-shadow(0 0 14px #ec4899); }
    }
    @keyframes cosmicOrbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .cosmic-pulse {
      transform-origin: 150px 150px;
      animation: cosmicTwinkle 4s ease-in-out infinite;
    }
    .cosmic-orbit {
      transform-origin: 150px 150px;
      animation: cosmicOrbit 18s linear infinite;
    }
  </style>

  <g class="cosmic-pulse" filter="url(#violetGlow)">
    <!-- Halo Nebular de Fundo -->
    <circle cx="150" cy="150" r="120" fill="none" stroke="rgba(168, 85, 247, 0.25)" stroke-width="8" stroke-dasharray="80 30 60 40" />

    <!-- Anéis Celestiais Orbitais -->
    <g class="cosmic-orbit">
      <circle cx="150" cy="150" r="122" fill="none" stroke="url(#cosmicGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="140 25 30 25" />

      <!-- Estrelas Cintilantes de 4 Pontas -->
      <g transform="translate(150, 28)">
        <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2" fill="#fbcfe8" />
      </g>
      <g transform="translate(272, 150)">
        <polygon points="0,-5 1.5,-1.5 5,0 1.5,1.5 0,5 -1.5,1.5 -5,0 -1.5,-1.5" fill="#e9d5ff" />
      </g>
      <g transform="translate(150, 272)">
        <polygon points="0,-6 2,-2 6,0 2,2 0,6 -2,2 -6,0 -2,-2" fill="#fbcfe8" />
      </g>
      <g transform="translate(28, 150)">
        <polygon points="0,-5 1.5,-1.5 5,0 1.5,1.5 0,5 -1.5,1.5 -5,0 -1.5,-1.5" fill="#e9d5ff" />
      </g>
    </g>

    <!-- Borda Interna para o Avatar -->
    <circle cx="150" cy="150" r="106" fill="none" stroke="rgba(192, 132, 252, 0.55)" stroke-width="1.8" />
  </g>
</svg>
