<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="skullAuraCyan" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="0.75" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="skullAuraViolet" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="starGleamGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#fef08a"/>
      <stop offset="0.7" stop-color="#eab308"/>
      <stop offset="1" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="etherealBloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleAuraGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    /* 1. Aura Flamejante no Topo da Caveira */
    @keyframes skullAuraFlames {
      0%, 100% {
        transform: translateY(0px) scale(0.98);
        opacity: 0.65;
        filter: drop-shadow(0 -2px 6px #00f0ff);
      }
      50% {
        transform: translateY(-4px) scale(1.05);
        opacity: 0.95;
        filter: drop-shadow(0 -5px 12px #38bdf8) drop-shadow(0 -10px 18px rgba(192, 132, 252, 0.8));
      }
    }

    @keyframes skullAuraFlamesSecondary {
      0%, 100% {
        transform: translateY(0px) scale(1.02);
        opacity: 0.85;
      }
      50% {
        transform: translateY(-5px) scale(0.96);
        opacity: 0.45;
        filter: drop-shadow(0 -4px 10px #c084fc);
      }
    }

    /* 2. Brilho Místico no Olho da Caveira */
    @keyframes skullEyePulse {
      0%, 100% {
        opacity: 0.4;
        transform: scale(0.85);
        filter: drop-shadow(0 0 2px #00f0ff);
      }
      50% {
        opacity: 1;
        transform: scale(1.25);
        filter: drop-shadow(0 0 8px #00f0ff) drop-shadow(0 0 14px #ffffff);
      }
    }

    /* 3. Onda de Choque do Fone/Driver (Top-Right) */
    @keyframes driverWavePulse {
      0% {
        r: 12px;
        opacity: 0.95;
        stroke-width: 2.2px;
      }
      50% {
        opacity: 0.5;
        stroke-width: 1.5px;
      }
      100% {
        r: 32px;
        opacity: 0;
        stroke-width: 0.5px;
      }
    }

    /* 4. Giro Estelar da Estrela no Fone */
    @keyframes starSpinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* 5. Pulso do Propulsor/Canhão Sônico (Top-Left) */
    @keyframes thrusterBeam {
      0%, 100% {
        opacity: 0.6;
        filter: drop-shadow(0 0 3px #00f0ff);
        transform: scale(0.95);
      }
      50% {
        opacity: 1;
        filter: drop-shadow(0 0 10px #00f0ff) drop-shadow(0 0 16px #38bdf8);
        transform: scale(1.1);
      }
    }

    /* 6. Brilho da Estrela-Bússola Inferior */
    @keyframes compassStarGlint {
      0%, 100% {
        opacity: 0.7;
        filter: drop-shadow(0 0 3px #fde047);
      }
      50% {
        opacity: 1;
        filter: drop-shadow(0 0 8px #fef08a) drop-shadow(0 0 14px #00f0ff);
      }
    }

    /* 7. Giro Lento do Anel da Bússola */
    @keyframes compassRingSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* 8. Fagulhas Estelares Cósmicas */
    @keyframes cosmicSpark {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); filter: drop-shadow(0 0 5px #ffffff); }
    }

    .aura-main {
      transform-origin: 200px 35px;
      animation: skullAuraFlames 2.6s ease-in-out infinite;
    }
    .aura-secondary {
      transform-origin: 200px 35px;
      animation: skullAuraFlamesSecondary 3.1s ease-in-out infinite;
    }
    .skull-eye {
      transform-origin: 187px 46px;
      animation: skullEyePulse 2.2s ease-in-out infinite;
    }
    .driver-pulse-1 {
      animation: driverWavePulse 2.4s cubic-bezier(0.1, 0.7, 0.3, 1) infinite;
    }
    .driver-pulse-2 {
      animation: driverWavePulse 2.4s cubic-bezier(0.1, 0.7, 0.3, 1) infinite 1.2s;
    }
    .star-rot {
      transform-origin: 249px 60px;
      animation: starSpinSlow 16s linear infinite;
    }
    .thruster-glow {
      transform-origin: 42px 73px;
      animation: thrusterBeam 1.8s ease-in-out infinite;
    }
    .compass-glint {
      transform-origin: 150px 256px;
      animation: compassStarGlint 2.8s ease-in-out infinite;
    }
    .compass-spin {
      transform-origin: 150px 256px;
      animation: compassRingSpin 18s linear infinite;
    }
    .sparkle-1 { animation: cosmicSpark 2s ease-in-out infinite; }
    .sparkle-2 { animation: cosmicSpark 2.4s ease-in-out infinite 0.7s; }
    .sparkle-3 { animation: cosmicSpark 1.9s ease-in-out infinite 1.3s; }
  </style>
  <image href="/cosmetics/frames/vox-resonance.png" x="0" y="0" width="300" height="300" preserveAspectRatio="xMidYMid meet"/>
  <g filter="url(#etherealBloom)">
    <path class="aura-main" d="M 175 38 C 182 22 195 12 208 8 C 218 5 228 12 236 22 C 242 30 240 40 234 44 C 224 28 206 18 190 28 C 182 32 178 36 175 38 Z" fill="url(#skullAuraCyan)"/>
    <path class="aura-secondary" d="M 188 34 C 196 18 212 10 224 6 C 218 16 215 24 222 32 C 214 20 200 16 194 28 Z" fill="url(#skullAuraViolet)"/>
    <path class="aura-main" d="M 216 14 C 222 4 230 -2 235 -6 C 235 2 232 10 226 18 Z" fill="#00f0ff" opacity="0.8"/>
  </g>
  <g class="skull-eye" filter="url(#etherealBloom)">
    <circle cx="187.5" cy="46" r="3.2" fill="#00f0ff"/>
    <circle cx="187.5" cy="46" r="1.5" fill="#ffffff"/>
  </g>
  <g transform="matrix(1, 0, 0, 1, 255.10228, 60)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#00f0ff" class="driver-pulse-1" filter="url(#subtleAuraGlow)"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#c084fc" class="driver-pulse-2" filter="url(#subtleAuraGlow)"/>
  </g>
  <g class="thruster-glow" transform="translate(42.5, 73)">
    <circle cx="0" cy="0" r="5" fill="#00f0ff" filter="url(#etherealBloom)"/>
    <circle cx="0" cy="0" r="2" fill="#ffffff"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="6 3"/>
  </g>
  <g class="compass-glint" transform="translate(150, 255.5)" filter="url(#etherealBloom)">
    <polygon points="0,-16 3,-3 16,0 3,3 0,16 -3,3 -16,0 -3,-3" fill="url(#starGleamGold)" opacity="0.65"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
  </g>
  <g class="sparkle-1" transform="translate(30, 150)" filter="url(#subtleAuraGlow)">
    <circle cx="0" cy="0" r="2.2" fill="#00f0ff"/>
    <polygon points="0,-6 1,-1 6,0 1,1 0,6 -1,1 -6,0 -1,-1" fill="#ffffff" opacity="0.75"/>
  </g>
  <g class="sparkle-2" transform="translate(270, 150)" filter="url(#subtleAuraGlow)">
    <circle cx="0" cy="0" r="2.2" fill="#fde047"/>
    <polygon points="0,-6 1,-1 6,0 1,1 0,6 -1,1 -6,0 -1,-1" fill="#ffffff" opacity="0.75"/>
  </g>
  <circle cx="95" cy="40" r="1.5" fill="#38bdf8" class="sparkle-3" filter="url(#subtleAuraGlow)"/>
  <circle cx="120" cy="24" r="1.8" fill="#ffffff" class="sparkle-1" filter="url(#subtleAuraGlow)"/>
  <circle cx="70" cy="100" r="1.4" fill="#00f0ff" class="sparkle-2" filter="url(#subtleAuraGlow)"/>
</svg>