<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="neonMintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes neonSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes breathe {
      0%, 100% { filter: drop-shadow(0 0 4px #34d399); opacity: 0.9; }
      50% { filter: drop-shadow(0 0 12px #34d399); opacity: 1; }
    }
    .neon-spin {
      transform-origin: 150px 150px;
      animation: neonSpin 12s linear infinite;
    }
    .neon-pulse {
      animation: breathe 3.5s ease-in-out infinite;
    }
  </style>

  <g class="neon-pulse" filter="url(#neonGlow)">
    <!-- Anel Base Suave -->
    <circle cx="150" cy="150" r="118" fill="none" stroke="rgba(52, 211, 153, 0.2)" stroke-width="6" />

    <!-- Anel Animado Principal -->
    <g class="neon-spin">
      <circle cx="150" cy="150" r="118" fill="none" stroke="url(#neonMintGrad)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="120 40 30 20" />
      
      <!-- Detalhes Cardeais -->
      <circle cx="150" cy="32" r="3.5" fill="#ffffff" />
      <circle cx="268" cy="150" r="3.5" fill="#34d399" />
      <circle cx="150" cy="268" r="3.5" fill="#ffffff" />
      <circle cx="32" cy="150" r="3.5" fill="#34d399" />
    </g>

    <!-- Borda Interna de Contenção do Avatar (R=106) -->
    <circle cx="150" cy="150" r="106" fill="none" stroke="rgba(52, 211, 153, 0.5)" stroke-width="1.5" />
  </g>
</svg>
